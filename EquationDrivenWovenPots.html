<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Equation-Driven Woven Pots</title>
    <style>
        :root { --bg: #f4f7f6; --panel: #ffffff; --primary: #3498db; --secondary: #2c3e50; --success: #27ae60; --highlight: #9b59b6; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); }
        #sidebar { width: clamp(360px, 29vw, 420px); background: var(--panel); padding: 25px; box-shadow: 2px 0 15px rgba(0,0,0,0.1); overflow-y: auto; z-index: 100; }
        .input-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #444; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        input:disabled { opacity: 0.5; cursor: not-allowed; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: #eaf5fc; padding: 10px; border-radius: 6px; border: 1px solid var(--primary); }
        .checkbox-group input { width: auto; cursor: pointer; }
        textarea { height: 60px; font-family: 'Courier New', monospace; background: #fafafa; }
        button { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-preview { background: var(--secondary); }
        .btn-obj { background: var(--primary); }
        .btn-stl { background: var(--success); }
        button:hover { filter: brightness(1.05); }
        #viewer-container { flex-grow: 1; background: #ffffff; position: relative; }
        #status { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 18px; border-radius: 20px; font-size: 11px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .section-title { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px 0; padding-bottom: 5px; border-bottom: 1px solid #eee; cursor: pointer; user-select: none; position: relative; padding-right: 16px; }
        .section-title::after { content: '\25BE'; position: absolute; right: 2px; top: 0; transition: transform 0.2s ease; }
        .collapsible-section.is-collapsed .section-title::after { transform: rotate(-90deg); }
        .collapsible-section.is-collapsed .section-body { display: none; }
        .sub-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 6px 0; }
        @media (max-width: 480px) {
            #sidebar { width: 100%; padding: 16px; }
            body { flex-direction: column; height: auto; }
            #viewer-container { height: 60vh; }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="margin-top:0; color:var(--secondary)">Equation-Driven Woven Pots</h2>

    <div class="collapsible-section">
        <div class="section-title" onclick="toggleSection(this)">Base Scaffold</div>
        <div class="section-body">
            <div class="input-group">
                <label>Model Type</label>
                <select id="modelMode" onchange="onModelModeChange()">
                    <option value="object">3D Object (Closed Loop)</option>
                    <option value="pot" selected>Pot (Cut Open)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Topology Path</label>
                <select id="pathType" onchange="applyPathPreset()">
                    <option value="Torus Knot" selected>Torus Knot</option>
                    <option value="Flower Ring">Flower Ring</option>
                    <option value="Braided Loop">Braided Loop</option>
                    <option value="Mobius Curve">Mobius Curve</option>
                </select>
            </div>

            <div class="input-group">
                <label>Profile Preset</label>
                <select id="profileSelect" onchange="applyProfilePreset()">
                    <option value="Circle">Circle</option>
                    <option value="DoublePetal">Double Petal</option>
                    <option value="ThreePetal">Triangle</option>
                    <option value="Square">Square</option>
                    <option value="FivePetal">Star</option>
                </select>
            </div>

            <textarea id="equation" onchange="updatePreview()">3.0</textarea>

            <div class="sub-label">Geometric Basis</div>
            <div class="grid-inputs">
                <div class="input-group"><label>Path Diam (cm)</label><input type="number" id="diameter" value="20" onchange="updatePreview()"></div>
                <div class="input-group"><label>Z-Stretch</label><input type="number" id="zStretch" value="10.0" step="0.1" onchange="updatePreview()"></div>
            </div>

            <div id="dynamic-params"></div>

            <div class="sub-label">Orientation</div>
            <div class="grid-3">
                <div class="input-group"><label>Rotate X (deg)</label><input type="number" id="rotX" value="0" step="1" onchange="updatePreview()"></div>
                <div class="input-group"><label>Rotate Y (deg)</label><input type="number" id="rotY" value="0" step="1" onchange="updatePreview()"></div>
                <div class="input-group"><label>Rotate Z (deg)</label><input type="number" id="rotZ" value="0" step="1" onchange="updatePreview()"></div>
            </div>
        </div>
    </div>

    <div class="collapsible-section">
        <div class="section-title" onclick="toggleSection(this)">Structural Geometry</div>
        <div class="section-body">
            <div id="potCuttingWrap" style="display:block;">
                <div class="sub-label">Pot Cutting</div>
                <div class="grid-inputs">
                    <div class="input-group"><label>Bottom Cut (%)</label><input type="number" id="bottomCutPct" value="10" min="0" max="99" step="1" onchange="onCutPctChange()"></div>
                    <div class="input-group"><label>Top Cut (%)</label><input type="number" id="topCutPct" value="90" min="1" max="100" step="1" onchange="onCutPctChange()"></div>
                </div>
                <div class="grid-inputs">
                    <div class="input-group"><label>Height (cm)</label><input type="number" id="potHeight" step="0.1" onchange="onHeightChange()"></div>
                    <div class="input-group"><label>Bottom Thickness (cm)</label><input type="number" id="bottomThick" value="0.35" step="0.05" min="0" onchange="updatePreview()"></div>
                </div>
                <div class="input-group"><label>Drain Hole Diameter (cm, 0 = none)</label><input type="number" id="drainHoleDiam" value="1" min="0" step="0.1" onchange="updatePreview()"></div>
            </div>

            <div class="sub-label">Fabrication Options</div>
            <div class="grid-inputs">
                <div class="input-group"><label>Fill (%)</label><input type="number" id="fillPct" value="100" min="1" max="100" step="1" onchange="onFillPctChange()"></div>
                <div class="input-group"><label>Wall Thickness (cm)</label><input type="number" id="shellThick" value="0.35" step="0.05" onchange="onShellThickChange()"></div>
            </div>

            <div class="sub-label">Self-Intersection Handling</div>
            <div class="checkbox-group">
                <input type="checkbox" id="avoidIntersection" onchange="updatePreview()">
                <label for="avoidIntersection" style="margin-bottom:0;">Reduce radius where the path crosses itself (unchecked: merge the crossing bodies)</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="extraClean" onchange="updatePreview()">
                <label for="extraClean" style="margin-bottom:0;">Extra cleaning: true-shell cavity in overlap zones (removes thin blades, slower)</label>
            </div>
            <div class="input-group"><label>Debris Threshold (% of largest body, 0.01–1)</label><input type="number" id="debrisPct" value="0.1" min="0.01" max="1" step="0.01" onchange="onDebrisPctChange()"></div>
        </div>
    </div>

    <div class="collapsible-section">
        <div class="section-title" onclick="toggleSection(this)">Mesh Resolution</div>
        <div class="section-body">
            <div class="grid-inputs">
                <div class="input-group"><label>Path Steps</label><input type="number" id="sections" value="400" onchange="updatePreview()"></div>
                <div class="input-group"><label>Radial Points</label><input type="number" id="radialRes" value="48" onchange="updatePreview()"></div>
            </div>
        </div>
    </div>

    <button class="btn-preview" onclick="updatePreview()">GENERATE 3D MODEL</button>
    <button class="btn-obj" onclick="exportOBJ()">EXPORT .OBJ</button>
    <button class="btn-stl" onclick="exportSTL()">EXPORT .STL (PRINT READY)</button>
</div>

<div id="viewer-container">
    <div id="status">System Online</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    let scene, camera, renderer, controls, currentMesh;
    let axisScene, axisCamera;

    function toggleSection(titleEl) {
        titleEl.parentElement.classList.toggle('is-collapsed');
    }

    const pathLib = {
        "Mobius Curve": { params: [], defaultRotY: 270 },
        "Torus Knot": { params: [{id:'p',label:'p (Main)',val:2,step:1},{id:'q',label:'q (Secondary)',val:3,step:1},{id:'amp',label:'Amplitude',val:3.5,step:0.1}], defaultRotY: 0 },
        "Flower Ring": { params: [{id:'n',label:'Petals (n)',val:5,step:1},{id:'amp',label:'Amplitude',val:3,step:0.1}], defaultRotY: 0 },
        "Braided Loop": { params: [{id:'n1',label:'Base Freq (n1)',val:3,step:1},{id:'amp1',label:'Amp 1',val:2.5,step:0.1},{id:'amp2',label:'Amp 2',val:1.0,step:0.1}], defaultRotY: 0 }
    };

    function applyPathPreset() {
        const key = document.getElementById('pathType').value;
        const data = pathLib[key];
        const container = document.getElementById('dynamic-params');
        container.innerHTML = data.params.map(p => `
            <div class="input-group"><label>${p.label}</label><input type="number" id="${p.id}" value="${p.val}" step="${p.step}" onchange="updatePreview()"></div>
        `).join('');
        document.getElementById('rotY').value = data.defaultRotY || 0;
        updatePreview();
    }

    function applyProfilePreset() {
        // Base constant updated to 3.0 for 6cm Diameter
        const p = { 
            "Circle": "3.0", 
            "DoublePetal": "3.0*(1+0.4*cos(2*theta))", 
            "ThreePetal": "3.0*(1+0.3*cos(3*theta))", 
            "Square": "3.0*(1+0.2*cos(4*theta))", 
            "FivePetal": "3.0*(1+0.3*cos(5*theta))" 
        };
        document.getElementById('equation').value = p[document.getElementById('profileSelect').value];
        updatePreview();
    }

    function getPathPoint(t, cfg) {
        const rx = cfg.diameter * 0.5, zA = cfg.zStretch, pi = Math.PI, sin = Math.sin, cos = Math.cos;
        if (cfg.type === 'Mobius Curve') {
            let phi = 0.5 * t;
            return new THREE.Vector3((rx + zA * cos(phi)) * cos(t), (rx + zA * cos(phi)) * sin(t), zA * sin(phi));
        } else if (cfg.type === 'Torus Knot') {
            return new THREE.Vector3((rx + cfg.amp * cos(cfg.q * t)) * cos(cfg.p * t), (rx + cfg.amp * cos(cfg.q * t)) * sin(cfg.p * t), zA * sin(cfg.q * t));
        } else if (cfg.type === 'Flower Ring') {
            return new THREE.Vector3((rx + cfg.amp * cos(cfg.n * t)) * cos(t), (rx + cfg.amp * cos(cfg.n * t)) * sin(t), zA * sin(cfg.n * t));
        } else if (cfg.type === 'Braided Loop') {
            let n2 = cfg.n1 + 3, rad = rx + cfg.amp1 * cos(cfg.n1 * t) + cfg.amp2 * cos(n2 * t);
            return new THREE.Vector3(rad * cos(t), rad * sin(t), zA * sin(cfg.n1 * t) + cfg.amp2 * sin(n2 * t));
        }
    }

    function makeRotationMatrix(rotX, rotY, rotZ) {
        if (!rotX && !rotY && !rotZ) return null;
        return new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(
            THREE.MathUtils.degToRad(rotX || 0), THREE.MathUtils.degToRad(rotY || 0), THREE.MathUtils.degToRad(rotZ || 0), 'XYZ'
        ));
    }

    // For every ring in the closed sweep, the shortest distance to any OTHER, non-locally-adjacent
    // ring's centerline. Drives the optional radius pinch, and decides how short the sweep pieces
    // handed to the CSG union must be so that no single piece contains both arms of a crossing.
    function computeRingProximity(pts, steps, profileMaxR) {
        const cumLen = [0];
        for (let i = 0; i < steps; i++) cumLen.push(cumLen[i] + pts[i].distanceTo(pts[(i+1)%steps]));
        const totalLen = cumLen[steps];
        const excludeArc = Math.max(3 * profileMaxR, totalLen * 0.02);
        const minDist = new Array(steps).fill(Infinity);
        const touchDist = 2 * profileMaxR + 0.05;
        let minCrossArc = Infinity; // shortest arc between two rings whose tubes touch or overlap
        const touching = [];        // flat (i, j) pairs of rings whose tubes touch or overlap
        for (let i = 0; i < steps; i++) {
            for (let j = i+1; j < steps; j++) {
                let d = Math.abs(cumLen[i]-cumLen[j]);
                d = Math.min(d, totalLen-d);
                if (d < excludeArc) continue;
                const dist = pts[i].distanceTo(pts[j]);
                if (dist < minDist[i]) minDist[i] = dist;
                if (dist < minDist[j]) minDist[j] = dist;
                if (dist < touchDist) {
                    touching.push(i, j);
                    if (d < minCrossArc) minCrossArc = d;
                }
            }
        }
        return { minDist, excludeArc, totalLen, minCrossArc, touching };
    }

    // Samples the path and builds rotation-minimizing frames, spreading the closed-loop twist
    // evenly along the sweep so the last ring lines up with the first.
    function buildSweepFrames(cfg) {
        const steps = cfg.sections, pi = Math.PI;
        const maxT = (cfg.type === 'Mobius Curve') ? 4 * pi : 2 * pi;
        const pts = [];
        for (let i = 0; i <= steps; i++) pts.push(getPathPoint((i/steps)*maxT, cfg));

        let tang = new THREE.Vector3().subVectors(pts[1], pts[0]).normalize();
        let norm = new THREE.Vector3(1,0,0);
        if (Math.abs(tang.x) > 0.9) norm.set(0,1,0);
        let bino = new THREE.Vector3().crossVectors(tang, norm).normalize();
        norm.crossVectors(bino, tang).normalize();

        const raw = [];
        for (let i = 0; i <= steps; i++) {
            const pNext = pts[(i+1)%(steps+1)], pPrev = pts[(i-1+steps+1)%(steps+1)];
            const cTang = new THREE.Vector3().subVectors(pNext, pPrev).normalize();
            const axis = new THREE.Vector3().crossVectors(tang, cTang);
            if (axis.length() > 0.0001) {
                const quat = new THREE.Quaternion().setFromAxisAngle(axis.normalize(), Math.acos(Math.min(Math.max(tang.dot(cTang), -1), 1)));
                norm.applyQuaternion(quat); bino.applyQuaternion(quat);
            }
            tang.copy(cTang);
            raw.push({ p: pts[i], n: norm.clone(), b: bino.clone() });
        }
        const err = Math.atan2(raw[steps].n.dot(raw[0].b), raw[steps].n.dot(raw[0].n));
        const frames = [];
        for (let i = 0; i < steps; i++) {
            const corr = -(i/steps)*err, c = Math.cos(corr), s = Math.sin(corr);
            frames.push({
                p: raw[i].p,
                n: raw[i].n.clone().multiplyScalar(c).add(raw[i].b.clone().multiplyScalar(s)),
                b: raw[i].b.clone().multiplyScalar(c).sub(raw[i].n.clone().multiplyScalar(s))
            });
        }
        return { frames, pts: pts.slice(0, steps), steps };
    }

    // Rotated ring outlines (flat xyz arrays) and ring centers for the outer wall — and, when
    // hollow, the inner wall offset inward by the wall thickness — plus how the sweep has to be
    // split into pieces for the CSG union.
    function buildRings(cfg) {
        const { frames, pts, steps } = buildSweepFrames(cfg);
        const resR = cfg.radialRes;
        const profile = sampleProfileR(cfg.eq, resR).map(r => Math.max(0.01, r));
        const profileMaxR = Math.max(...profile);
        const prox = computeRingProximity(pts, steps, profileMaxR);
        const rot = makeRotationMatrix(cfg.rotX, cfg.rotY, cfg.rotZ);
        const v = new THREE.Vector3();
        const place = (f, r, theta, out, k) => {
            v.copy(f.p).addScaledVector(f.n, r * Math.cos(theta)).addScaledVector(f.b, r * Math.sin(theta));
            if (rot) v.applyMatrix4(rot);
            out[k] = v.x; out[k+1] = v.y; out[k+2] = v.z;
        };
        const outer = [], inner = [], centers = [];
        let minZ = Infinity, maxZ = -Infinity;
        for (let i = 0; i < steps; i++) {
            const f = frames[i];
            // Pinch mode: cap the radius so this ring stays clear of the nearest other ring.
            const cap = cfg.avoidSelfIntersect && isFinite(prox.minDist[i]) ? prox.minDist[i] * 0.45 : Infinity;
            const ro = new Float64Array(resR * 3), ri = cfg.doHollow ? new Float64Array(resR * 3) : null;
            for (let j = 0; j < resR; j++) {
                const theta = (j / resR) * 2 * Math.PI, r = Math.max(0.01, Math.min(profile[j], cap));
                place(f, r, theta, ro, j * 3);
                if (ri) place(f, Math.max(0.01, r - cfg.shellThick), theta, ri, j * 3);
                if (ro[j*3+2] < minZ) minZ = ro[j*3+2];
                if (ro[j*3+2] > maxZ) maxZ = ro[j*3+2];
            }
            outer.push(ro);
            if (ri) inner.push(ri);
            const c = new Float64Array(3);
            place(f, 0, 0, c, 0);
            centers.push(c);
        }
        // Pieces must be shorter than the arc between any two crossing arms, so no piece ever
        // contains both sides of a crossing; if nothing crosses, the whole loop is one piece.
        const crosses = isFinite(prox.minCrossArc);
        const ringsPerPiece = crosses ? Math.max(2, Math.floor(steps * (prox.minCrossArc / prox.totalLen) * 0.9)) : steps;
        return { outer, inner, centers, steps, resR, minZ, maxZ, crosses, ringsPerPiece, touching: prox.touching, profileMaxR, debris: 0, debrisFrac: cfg.debrisPct / 100 };
    }

    // Closed solid for one run of rings a..b (indices wrap around the loop), or for the whole
    // closed sweep when `closed`: side quads between consecutive rings, plus a fan cap at each end
    // of a run. The end cap is a shallow cone poking into the next piece rather than a flat disc:
    // a flat disc would coincide exactly with the neighbour's start cap, and exact booleans leave
    // such coincident face pairs behind as zero-volume shells. Wound outward (positive volume),
    // which is what Manifold expects.
    function buildPieceManifold(rings, centers, a, b, steps, resR, closed) {
        const { Manifold, Mesh } = window.CSG;
        const nRings = closed ? steps : (b - a + 1);
        const pos = new Float32Array((nRings * resR + (closed ? 0 : 2)) * 3);
        for (let k = 0; k < nRings; k++) pos.set(rings[(a + k) % steps], k * resR * 3);
        const tris = [];
        const nSeg = closed ? steps : nRings - 1;
        for (let k = 0; k < nSeg; k++) {
            const r0 = k * resR, r1 = ((k + 1) % nRings) * resR;
            for (let j = 0; j < resR; j++) {
                const j1 = (j + 1) % resR;
                tris.push(r0 + j, r1 + j1, r1 + j,  r0 + j, r0 + j1, r1 + j1);
            }
        }
        if (!closed) {
            const cStart = nRings * resR, cEnd = cStart + 1, last = (nRings - 1) * resR;
            pos.set(centers[a % steps], cStart * 3);
            const cb = centers[b % steps], cn = centers[(b + 1) % steps], ring = rings[b % steps];
            let rMin = Infinity;
            for (let j = 0; j < resR; j++) rMin = Math.min(rMin, Math.hypot(ring[j*3] - cb[0], ring[j*3+1] - cb[1], ring[j*3+2] - cb[2]));
            const spacing = Math.max(1e-9, Math.hypot(cn[0] - cb[0], cn[1] - cb[1], cn[2] - cb[2]));
            const f = Math.min(0.4, 0.5 * rMin / spacing); // keep the apex inside a pinched tube too
            pos.set([cb[0] + f * (cn[0] - cb[0]), cb[1] + f * (cn[1] - cb[1]), cb[2] + f * (cn[2] - cb[2])], cEnd * 3);
            for (let j = 0; j < resR; j++) {
                const j1 = (j + 1) % resR;
                tris.push(cStart, j1, j,  cEnd, last + j, last + j1);
            }
        }
        return new Manifold(new Mesh({ numProp: 3, vertProperties: pos, triVerts: new Uint32Array(tris) }));
    }

    // Solid body of one wall: the CSG union of sweep pieces short enough that none can cross
    // itself, so wherever the path crosses itself the tube is merged with itself exactly — the
    // same "define the solid, then shell it" workflow as CAD, with no stitching heuristics.
    function buildWallSolid(rings, R) {
        const { Manifold } = window.CSG;
        const { centers, steps, resR, crosses, ringsPerPiece } = R;
        if (!crosses) return buildPieceManifold(rings, centers, 0, 0, steps, resR, true);
        const pieces = [];
        for (let a = 0; a < steps; a += ringsPerPiece) {
            pieces.push(buildPieceManifold(rings, centers, a, Math.min(a + ringsPerPiece, steps), steps, resR, false));
        }
        let solid = Manifold.union(pieces);
        pieces.forEach(p => p.delete());
        const cleaned = cleanDebris(solid, R.debrisFrac);
        if (cleaned.solid) { solid.delete(); solid = cleaned.solid; }
        R.debris += cleaned.removed;
        return solid;
    }

    // Axis-aligned boxes around every zone where the tube overlaps itself. Rings are grouped into
    // zones through the touching pairs themselves (plus path adjacency), so the two arms of a
    // crossing share a zone while separate crossings stay apart. Each touching pair's overlap
    // lens lies inside the ball of radius sqrt(R² − d²/4) around the pair's midpoint, so a zone's
    // box is the union of those balls, padded for the wall and the field band — much tighter
    // than boxing whole tube cross-sections. Boxes that still overlap are merged.
    function overlapBoxes(R, t, e) {
        const { centers, touching, profileMaxR, steps } = R;
        if (!touching.length) return [];
        const parent = new Int32Array(steps);
        for (let i = 0; i < steps; i++) parent[i] = i;
        const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
        const isTouching = new Uint8Array(steps);
        for (let k = 0; k < touching.length; k += 2) {
            parent[find(touching[k])] = find(touching[k+1]);
            isTouching[touching[k]] = 1; isTouching[touching[k+1]] = 1;
        }
        for (let i = 0; i < steps; i++) if (isTouching[i] && isTouching[(i+1) % steps]) parent[find(i)] = find((i+1) % steps);
        const pad = t + 3 * e, R2 = profileMaxR * profileMaxR;
        const byRoot = new Map();
        for (let k = 0; k < touching.length; k += 2) {
            const p = centers[touching[k]], q = centers[touching[k+1]];
            const dx = p[0]-q[0], dy = p[1]-q[1], dz = p[2]-q[2];
            const rho = Math.sqrt(Math.max(0, R2 - (dx*dx + dy*dy + dz*dz) / 4)) + pad;
            const m = [(p[0]+q[0])/2, (p[1]+q[1])/2, (p[2]+q[2])/2];
            const root = find(touching[k]);
            let box = byRoot.get(root);
            if (!box) { box = { min: [m[0]-rho, m[1]-rho, m[2]-rho], max: [m[0]+rho, m[1]+rho, m[2]+rho] }; byRoot.set(root, box); continue; }
            for (let a = 0; a < 3; a++) { box.min[a] = Math.min(box.min[a], m[a]-rho); box.max[a] = Math.max(box.max[a], m[a]+rho); }
        }
        let boxes = [...byRoot.values()];
        for (let merged = true; merged;) {
            merged = false;
            outer: for (let a = 0; a < boxes.length; a++) for (let b = a + 1; b < boxes.length; b++) {
                const A = boxes[a], B = boxes[b];
                if (A.min[0] > B.max[0] || B.min[0] > A.max[0] || A.min[1] > B.max[1] || B.min[1] > A.max[1] || A.min[2] > B.max[2] || B.min[2] > A.max[2]) continue;
                for (let k = 0; k < 3; k++) { A.min[k] = Math.min(A.min[k], B.min[k]); A.max[k] = Math.max(A.max[k], B.max[k]); }
                boxes.splice(b, 1); merged = true; break outer;
            }
        }
        return boxes;
    }

    // Closest point on triangle (a,b,c) to p, written into `out` (Ericson, RTCD §5.1.5).
    function closestPointOnTriangle(px, py, pz, a, b, c, out) {
        const abx = b[0]-a[0], aby = b[1]-a[1], abz = b[2]-a[2];
        const acx = c[0]-a[0], acy = c[1]-a[1], acz = c[2]-a[2];
        const apx = px-a[0], apy = py-a[1], apz = pz-a[2];
        const d1 = abx*apx + aby*apy + abz*apz, d2 = acx*apx + acy*apy + acz*apz;
        if (d1 <= 0 && d2 <= 0) { out[0] = a[0]; out[1] = a[1]; out[2] = a[2]; return; }
        const bpx = px-b[0], bpy = py-b[1], bpz = pz-b[2];
        const d3 = abx*bpx + aby*bpy + abz*bpz, d4 = acx*bpx + acy*bpy + acz*bpz;
        if (d3 >= 0 && d4 <= d3) { out[0] = b[0]; out[1] = b[1]; out[2] = b[2]; return; }
        const vc = d1*d4 - d3*d2;
        if (vc <= 0 && d1 >= 0 && d3 <= 0) { const v = d1/(d1-d3); out[0] = a[0]+v*abx; out[1] = a[1]+v*aby; out[2] = a[2]+v*abz; return; }
        const cpx = px-c[0], cpy = py-c[1], cpz = pz-c[2];
        const d5 = abx*cpx + aby*cpy + abz*cpz, d6 = acx*cpx + acy*cpy + acz*cpz;
        if (d6 >= 0 && d5 <= d6) { out[0] = c[0]; out[1] = c[1]; out[2] = c[2]; return; }
        const vb = d5*d2 - d1*d6;
        if (vb <= 0 && d2 >= 0 && d6 <= 0) { const w = d2/(d2-d6); out[0] = a[0]+w*acx; out[1] = a[1]+w*acy; out[2] = a[2]+w*acz; return; }
        const va = d3*d6 - d5*d4;
        if (va <= 0 && (d4-d3) >= 0 && (d5-d6) >= 0) {
            const w = (d4-d3)/((d4-d3)+(d5-d6));
            out[0] = b[0]+w*(c[0]-b[0]); out[1] = b[1]+w*(c[1]-b[1]); out[2] = b[2]+w*(c[2]-b[2]); return;
        }
        const denom = 1/(va+vb+vc), v = vb*denom, w = vc*denom;
        out[0] = a[0]+abx*v+acx*w; out[1] = a[1]+aby*v+acy*w; out[2] = a[2]+abz*v+acz*w;
    }

    // Unsigned distance from each point of a regular grid (origin `min`, spacing e, dims n*) to a
    // triangle mesh, needed only out to `band`: exact for cells within ~1.5 cells of the surface
    // (each triangle is rasterized into the cells around it), then propagated outward by handing
    // nearest-surface-point candidates between neighbouring cells (two sweeps over the
    // 26-neighbourhood). Cells beyond the band keep Infinity.
    function distanceFieldNear(mesh, min, e, nx, ny, nz, band) {
        const n = nx * ny * nz;
        const dist = new Float32Array(n).fill(Infinity);
        const near = new Float32Array(n * 3);
        const V = mesh.vertProperties, T = mesh.triVerts;
        const a = [0,0,0], b = [0,0,0], c = [0,0,0], q = [0,0,0];
        const gx0 = min[0], gy0 = min[1], gz0 = min[2];
        const gx1 = gx0 + (nx-1)*e, gy1 = gy0 + (ny-1)*e, gz1 = gz0 + (nz-1)*e;
        const reach = 1.5 * e;
        let seeded = false;
        for (let t = 0; t < T.length; t += 3) {
            const ia = T[t]*3, ib = T[t+1]*3, ic = T[t+2]*3;
            a[0] = V[ia]; a[1] = V[ia+1]; a[2] = V[ia+2];
            b[0] = V[ib]; b[1] = V[ib+1]; b[2] = V[ib+2];
            c[0] = V[ic]; c[1] = V[ic+1]; c[2] = V[ic+2];
            const bx0 = Math.min(a[0],b[0],c[0]) - reach, bx1 = Math.max(a[0],b[0],c[0]) + reach;
            const by0 = Math.min(a[1],b[1],c[1]) - reach, by1 = Math.max(a[1],b[1],c[1]) + reach;
            const bz0 = Math.min(a[2],b[2],c[2]) - reach, bz1 = Math.max(a[2],b[2],c[2]) + reach;
            if (bx1 < gx0 || bx0 > gx1 || by1 < gy0 || by0 > gy1 || bz1 < gz0 || bz0 > gz1) continue;
            const i0 = Math.max(0, Math.ceil((bx0-gx0)/e)), i1 = Math.min(nx-1, Math.floor((bx1-gx0)/e));
            const j0 = Math.max(0, Math.ceil((by0-gy0)/e)), j1 = Math.min(ny-1, Math.floor((by1-gy0)/e));
            const k0 = Math.max(0, Math.ceil((bz0-gz0)/e)), k1 = Math.min(nz-1, Math.floor((bz1-gz0)/e));
            for (let k = k0; k <= k1; k++) for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
                const px = gx0 + i*e, py = gy0 + j*e, pz = gz0 + k*e;
                closestPointOnTriangle(px, py, pz, a, b, c, q);
                const dx = px-q[0], dy = py-q[1], dz = pz-q[2];
                const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
                const idx = (k*ny + j)*nx + i;
                if (d < dist[idx]) { dist[idx] = d; near[idx*3] = q[0]; near[idx*3+1] = q[1]; near[idx*3+2] = q[2]; seeded = true; }
            }
        }
        if (!seeded) return null;
        const odx = [], ody = [], odz = [];
        for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
            if (dz < 0 || (dz === 0 && dy < 0) || (dz === 0 && dy === 0 && dx < 0)) { odx.push(dx); ody.push(dy); odz.push(dz); }
        }
        const nOff = odx.length, sxy = nx * ny;
        function sweep(forward) {
            const s = forward ? 1 : -1;
            for (let kk = 0; kk < nz; kk++) for (let jj = 0; jj < ny; jj++) for (let ii = 0; ii < nx; ii++) {
                const k = forward ? kk : nz-1-kk, j = forward ? jj : ny-1-jj, i = forward ? ii : nx-1-ii;
                const idx = k*sxy + j*nx + i;
                const px = gx0 + i*e, py = gy0 + j*e, pz = gz0 + k*e;
                let best = dist[idx];
                for (let o = 0; o < nOff; o++) {
                    const ni = i + s*odx[o], nj = j + s*ody[o], nk = k + s*odz[o];
                    if (ni < 0 || nj < 0 || nk < 0 || ni >= nx || nj >= ny || nk >= nz) continue;
                    const nidx = nk*sxy + nj*nx + ni;
                    if (dist[nidx] > band) continue;
                    const qx = near[nidx*3], qy = near[nidx*3+1], qz = near[nidx*3+2];
                    const dx = px-qx, dy = py-qy, dz = pz-qz;
                    const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    if (d < best) { best = d; dist[idx] = d; near[idx*3] = qx; near[idx*3+1] = qy; near[idx*3+2] = qz; }
                }
            }
        }
        sweep(true); sweep(false);
        return dist;
    }

    // Signed "cavity" field on a grid: (distance to the merged outer surface − t) inside the
    // solid, strongly negative outside it. Inside/outside comes from exact cross-sections of the
    // solid at each grid layer, scan-filled with the even-odd rule.
    function cavityField(mesh, outer, min, e, nx, ny, nz, t) {
        const band = t + 3 * e;
        const g = distanceFieldNear(mesh, min, e, nx, ny, nz, band);
        if (!g) return null;
        const inside = new Uint8Array(nx * ny * nz);
        for (let k = 0; k < nz; k++) {
            const cs = outer.slice(min[2] + k * e);
            const polys = cs.toPolygons();
            cs.delete();
            const layer = k * ny * nx;
            for (const poly of polys) {
                for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
                    const xa = poly[a][0], ya = poly[a][1], xb = poly[b][0], yb = poly[b][1];
                    if (ya === yb) continue;
                    const jlo = Math.max(0, Math.ceil((Math.min(ya, yb) - min[1]) / e)), jhi = Math.min(ny - 1, Math.floor((Math.max(ya, yb) - min[1]) / e));
                    for (let j = jlo; j <= jhi; j++) {
                        const y = min[1] + j * e;
                        if ((ya > y) === (yb > y)) continue;
                        const x = xa + (y - ya) * (xb - xa) / (yb - ya);
                        const row = layer + j * nx;
                        for (let i = Math.max(0, Math.ceil((x - min[0]) / e)); i < nx; i++) inside[row + i] ^= 1;
                    }
                }
            }
        }
        for (let idx = 0; idx < g.length; idx++) g[idx] = inside[idx] ? Math.min(g[idx], band) - t : -(t + 1);
        return g;
    }

    // True CAD-style shell inside the self-overlap zones: there the cavity must keep the wall
    // thickness from the *merged* outer surface, not from each arm's own tube (offsetting each arm
    // separately leaves thin blades where two arms' cavities nearly touch). For each zone box,
    // samples the signed cavity field and extracts its level set. Returns the union of the zone
    // boxes (where the per-arm cavity is to be discarded) and the level-set cavity to use instead.
    function shellFieldSpacing(t) { return Math.min(0.3, Math.max(0.1, t / 2)); }

    function buildTrueCavityPatch(outer, boxes, t) {
        const { Manifold } = window.CSG;
        const mesh = outer.getMesh();
        const patches = [], cubes = [];
        for (const box of boxes) {
            let e = shellFieldSpacing(t);
            const size = [0,1,2].map(k => box.max[k] - box.min[k]);
            const vol = size[0] * size[1] * size[2];
            if (vol / (e*e*e) > 6e5) e = Math.cbrt(vol / 6e5);
            const nx = Math.ceil(size[0]/e) + 1, ny = Math.ceil(size[1]/e) + 1, nz = Math.ceil(size[2]/e) + 1;
            const min = box.min, max = [min[0] + (nx-1)*e, min[1] + (ny-1)*e, min[2] + (nz-1)*e];
            // The cut-out box is a hair smaller than the level-set bounds, so the patch overlaps
            // into the remaining per-arm cavity instead of meeting it on exactly coincident faces
            // (which exact booleans would leave behind as zero-thickness flaps).
            const eps = 0.1 * e;
            cubes.push(Manifold.cube([max[0]-min[0]-2*eps, max[1]-min[1]-2*eps, max[2]-min[2]-2*eps], false).translate([min[0]+eps, min[1]+eps, min[2]+eps]));
            const g = cavityField(mesh, outer, min, e, nx, ny, nz, t);
            if (!g) continue;
            const sxy = nx * ny;
            const sample = p => {
                let fx = (p[0]-min[0])/e, fy = (p[1]-min[1])/e, fz = (p[2]-min[2])/e;
                fx = Math.min(nx-1.000001, Math.max(0, fx)); fy = Math.min(ny-1.000001, Math.max(0, fy)); fz = Math.min(nz-1.000001, Math.max(0, fz));
                const i = Math.floor(fx), j = Math.floor(fy), k = Math.floor(fz), tx = fx-i, ty = fy-j, tz = fz-k;
                const b0 = k*sxy + j*nx + i, b1 = b0 + nx, b2 = b0 + sxy, b3 = b2 + nx;
                const c00 = g[b0]*(1-tx) + g[b0+1]*tx, c10 = g[b1]*(1-tx) + g[b1+1]*tx;
                const c01 = g[b2]*(1-tx) + g[b2+1]*tx, c11 = g[b3]*(1-tx) + g[b3+1]*tx;
                return (c00*(1-ty) + c10*ty)*(1-tz) + (c01*(1-ty) + c11*ty)*tz;
            };
            const ls = Manifold.levelSet(sample, { min, max }, e);
            if (ls.isEmpty()) { ls.delete(); continue; }
            patches.push(ls.simplify(0.01));
            ls.delete();
        }
        const boxSolid = Manifold.union(cubes);
        cubes.forEach(c => c.delete());
        const patch = patches.length ? Manifold.compose(patches) : null;
        patches.forEach(p => p.delete());
        return { boxSolid, patch };
    }

    // Exact booleans on pieces that meet along shared rings can still leave zero-volume "shells"
    // (a pair of coincident faces glued together). They pass every manifold check but render as
    // floating discs, so drop each connected component whose volume is below `fraction` of the
    // largest one. Returns the recomposed solid (null if nothing was removed) and the count.
    function cleanDebris(solid, fraction) {
        const { Manifold } = window.CSG;
        const parts = solid.decompose();
        const vols = parts.map(p => p.volume());
        const floor = Math.max(...vols) * fraction;
        const kept = parts.filter((p, i) => vols[i] >= floor);
        const removed = parts.length - kept.length;
        const result = removed > 0 ? Manifold.compose(kept) : null;
        parts.forEach(p => p.delete());
        return { solid: result, removed };
    }

    // Where to drill in one floor region (a set of 2D contours, possibly concave or holed): its
    // area centroid when a full-size hole fits there, otherwise the interior point farthest from
    // the outline. Returns [x, y, clearance] or null.
    function pickHoleCenter(contours, holeR) {
        let area = 0, cx = 0, cy = 0, minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const c of contours) for (let i = 0; i < c.length; i++) {
            const [x0, y0] = c[i], [x1, y1] = c[(i + 1) % c.length];
            const cr = x0 * y1 - x1 * y0;
            area += cr; cx += (x0 + x1) * cr; cy += (y0 + y1) * cr;
            if (x0 < minX) minX = x0; if (x0 > maxX) maxX = x0;
            if (y0 < minY) minY = y0; if (y0 > maxY) maxY = y0;
        }
        if (Math.abs(area) < 1e-9) return null;
        cx /= 3 * area; cy /= 3 * area;
        const inside = (x, y) => {
            let hit = false;
            for (const c of contours) for (let i = 0, k = c.length - 1; i < c.length; k = i++) {
                const [xi, yi] = c[i], [xk, yk] = c[k];
                if ((yi > y) !== (yk > y) && x < (xk - xi) * (y - yi) / (yk - yi) + xi) hit = !hit;
            }
            return hit;
        };
        const clearance = (x, y) => {
            let best = Infinity;
            for (const c of contours) for (let i = 0, k = c.length - 1; i < c.length; k = i++) {
                const [x0, y0] = c[k], [x1, y1] = c[i];
                const dx = x1 - x0, dy = y1 - y0, l2 = dx*dx + dy*dy;
                const s = l2 > 0 ? Math.max(0, Math.min(1, ((x - x0)*dx + (y - y0)*dy) / l2)) : 0;
                best = Math.min(best, Math.hypot(x - (x0 + s*dx), y - (y0 + s*dy)));
            }
            return best;
        };
        if (inside(cx, cy)) {
            const d = clearance(cx, cy);
            if (d >= holeR / 0.6) return [cx, cy, d];
        }
        let best = null;
        const N = 24;
        for (let gx = 0; gx <= N; gx++) for (let gy = 0; gy <= N; gy++) {
            const x = minX + (maxX - minX) * (gx + 0.5) / (N + 1), y = minY + (maxY - minY) * (gy + 0.5) / (N + 1);
            if (!inside(x, y)) continue;
            const d = clearance(x, y);
            if (!best || d > best[2]) best = [x, y, d];
        }
        return best;
    }

    // One drainage hole per separate floor region: slices the solid floor slab at mid-thickness,
    // takes each connected region, and drills a vertical cylinder at its center. Returns the union
    // of the cylinders to subtract, or null if nothing fits.
    function buildDrainHoles(body, zLo, floorZ, holeDiam) {
        const { Manifold } = window.CSG;
        const section = body.slice((zLo + floorZ) / 2);
        const cyls = [];
        for (const region of section.decompose()) {
            const spot = pickHoleCenter(region.toPolygons(), holeDiam / 2);
            region.delete();
            if (!spot) continue;
            const r = Math.min(holeDiam / 2, spot[2] * 0.6);
            if (r < 0.05) continue;
            cyls.push(Manifold.cylinder((floorZ - zLo) + 0.2, r, r, 24, false).translate([spot[0], spot[1], zLo - 0.1]));
        }
        section.delete();
        if (!cyls.length) return null;
        const all = Manifold.union(cyls);
        cyls.forEach(c => c.delete());
        return all;
    }

    // Solid outer body → shelled by subtracting the inward-offset body → (pot) cut between the two
    // planes, cavity opened from the raised floor upward, drainage holes drilled. Every step is an
    // exact boolean, so the result is always a single watertight manifold.
    function buildMesh(cfg, scale) {
        if (!window.CSG) throw new Error('Geometry engine not loaded');
        const trash = [];
        const keep = m => { trash.push(m); return m; };
        try {
            const R = buildRings(cfg);
            const outer = keep(buildWallSolid(R.outer, R));
            let inner = cfg.doHollow ? keep(buildWallSolid(R.inner, R)) : null;
            // Optional (slower) extra cleaning in merge mode: replace the per-arm cavity inside
            // every self-overlap zone with the true offset of the merged outer surface, which
            // removes the thin blades left between nearly-touching arm cavities. Pinch mode
            // never overlaps, so there is nothing to do there.
            const boxes = inner && cfg.extraClean && !cfg.avoidSelfIntersect ? overlapBoxes(R, cfg.shellThick, shellFieldSpacing(cfg.shellThick)) : [];
            if (boxes.length) {
                const { boxSolid, patch } = buildTrueCavityPatch(outer, boxes, cfg.shellThick);
                inner = keep(inner.subtract(keep(boxSolid)));
                if (patch) inner = keep(inner.add(keep(patch)));
            }
            let result;
            if (cfg.mode === 'pot') {
                const zLo = R.minZ + (cfg.bottomCutPct/100) * (R.maxZ - R.minZ);
                const zHi = R.minZ + (cfg.topCutPct/100) * (R.maxZ - R.minZ);
                result = keep(keep(outer.trimByPlane([0,0,1], zLo)).trimByPlane([0,0,-1], -zHi));
                if (inner) {
                    // Raise the cavity's floor by the bottom thickness, leaving a solid slab there.
                    // The cavity extends above zHi, so subtracting it also opens the top rim.
                    const floorZ = Math.min(zHi - 1e-4, zLo + (cfg.bottomThick || 0));
                    result = keep(result.subtract(keep(inner.trimByPlane([0,0,1], floorZ))));
                    if (cfg.drainHoleDiam > 0 && floorZ - zLo > 0.02) {
                        const holes = buildDrainHoles(result, zLo, floorZ, cfg.drainHoleDiam);
                        if (holes) result = keep(result.subtract(keep(holes)));
                    }
                }
            } else {
                result = inner ? keep(outer.subtract(inner)) : outer;
            }
            if (result.status() !== 'NoError') throw new Error('CSG failed: ' + result.status());
            const cleaned = cleanDebris(result, R.debrisFrac);
            if (cleaned.solid) result = keep(cleaned.solid);
            R.debris += cleaned.removed;
            const mesh = result.getMesh();
            const positions = Float32Array.from(mesh.vertProperties);
            if (scale !== 1) for (let i = 0; i < positions.length; i++) positions[i] *= scale;
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setIndex(new THREE.BufferAttribute(Uint32Array.from(mesh.triVerts), 1));
            geo.computeVertexNormals();
            geo.userData.debrisRemoved = R.debris;
            return geo;
        } finally {
            trash.forEach(m => m.delete());
        }
    }

    function getFullHeightCm(cfg) {
        const R = buildRings(cfg);
        return R.maxZ - R.minZ;
    }

    function readCfg() {
        return {
            type: document.getElementById('pathType').value, eq: document.getElementById('equation').value,
            diameter: parseFloat(document.getElementById('diameter').value), zStretch: parseFloat(document.getElementById('zStretch').value),
            sections: parseInt(document.getElementById('sections').value), radialRes: parseInt(document.getElementById('radialRes').value),
            shellThick: parseFloat(document.getElementById('shellThick').value), doHollow: parseFloat(document.getElementById('fillPct').value) < 100,
            mode: document.getElementById('modelMode').value,
            avoidSelfIntersect: document.getElementById('avoidIntersection')?.checked ?? false,
            extraClean: document.getElementById('extraClean')?.checked ?? false,
            bottomCutPct: parseFloat(document.getElementById('bottomCutPct')?.value || 10),
            topCutPct: parseFloat(document.getElementById('topCutPct')?.value || 90),
            drainHoleDiam: Math.max(0, parseFloat(document.getElementById('drainHoleDiam')?.value || 0)),
            debrisPct: Math.min(1, Math.max(0.01, parseFloat(document.getElementById('debrisPct')?.value) || 0.1)),
            bottomThick: parseFloat(document.getElementById('bottomThick')?.value || 0),
            rotX: parseFloat(document.getElementById('rotX')?.value || 0),
            rotY: parseFloat(document.getElementById('rotY')?.value || 0),
            rotZ: parseFloat(document.getElementById('rotZ')?.value || 0),
            p: parseFloat(document.getElementById('p')?.value || 2), q: parseFloat(document.getElementById('q')?.value || 3),
            n: parseFloat(document.getElementById('n')?.value || 5), n1: parseFloat(document.getElementById('n1')?.value || 3),
            amp: parseFloat(document.getElementById('amp')?.value || 3.5), amp1: parseFloat(document.getElementById('amp1')?.value || 2.5),
            amp2: parseFloat(document.getElementById('amp2')?.value || 1.0)
        };
    }

    let previewTimer = null, previewPending = false;
    function setStatus(text) { document.getElementById('status').innerText = text; }

    // Coalesces the bursts of updatePreview() calls the UI handlers make into a single CSG build,
    // and defers it while the geometry engine is still loading.
    function updatePreview() {
        previewPending = true;
        if (previewTimer === null) previewTimer = setTimeout(runPreview, 0);
    }

    function runPreview() {
        previewTimer = null;
        if (!window.CSG) { setStatus('Loading geometry engine…'); return; }
        previewPending = false;
        if (currentMesh) { scene.remove(currentMesh); currentMesh.geometry.dispose(); }
        const cfg = readCfg();
        const t0 = performance.now();
        let geo;
        try { geo = buildMesh(cfg, 1.0); }
        catch (e) { console.error(e); setStatus('Build failed: ' + e.message); return; }
        currentMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0xbc9b70, side: THREE.DoubleSide, roughness: 0.4}));
        scene.add(currentMesh);
        if (cfg.mode === 'pot') {
            geo.computeBoundingBox();
            const h = geo.boundingBox.max.z - geo.boundingBox.min.z;
            document.getElementById('potHeight').value = h.toFixed(2);
        }
        const debris = geo.userData.debrisRemoved ? ` · ${geo.userData.debrisRemoved} debris shells removed` : '';
        setStatus(`3D Model · ${(geo.index.count / 3).toLocaleString()} tris · ${Math.round(performance.now() - t0)} ms${debris}`);
    }

    function onCsgReady() { if (previewPending && scene) updatePreview(); }
    function onCsgFailed(err) { console.error(err); setStatus('Geometry engine failed to load (internet connection required)'); }

    function requireCsg() {
        if (window.CSG) return true;
        setStatus('Geometry engine still loading — try again in a moment');
        return false;
    }

    // Samples the profile equation r(theta) once; area calculations then reuse the samples
    // without re-evaluating the (potentially slow, string-eval'd) equation.
    function sampleProfileR(eq, N) {
        N = N || 360;
        const pi = Math.PI, sin = Math.sin, cos = Math.cos;
        const rs = [];
        for (let j = 0; j < N; j++) {
            let theta = (j/N) * 2 * pi, r;
            try { r = eval(eq); } catch (e) { r = 3.0; }
            rs.push(r);
        }
        return rs;
    }

    function areaFromSamples(rs, radiusAdjust) {
        const N = rs.length, dtheta = (2*Math.PI) / N;
        let area = 0;
        for (let j = 0; j < N; j++) {
            let r = rs[j];
            if (radiusAdjust) r = radiusAdjust(r);
            area += 0.5 * r * r * dtheta;
        }
        return area;
    }

    // The profile equation only depends on theta (not on path position), so the cross-sectional
    // area is constant along the whole sweep — fill % can be computed from a single 2D profile
    // slice rather than the full 3D mesh, and inverted with a cheap binary search.
    function computeFillPercent(eq, shellThick) {
        const rs = sampleProfileR(eq);
        const areaOuter = areaFromSamples(rs, null);
        if (areaOuter <= 0) return 100;
        const areaInner = areaFromSamples(rs, r => Math.max(0.01, r - shellThick));
        return Math.max(0, Math.min(100, (1 - areaInner/areaOuter) * 100));
    }

    function solveWallThicknessForFill(eq, targetFillPct) {
        const rs = sampleProfileR(eq);
        const areaOuter = areaFromSamples(rs, null);
        if (areaOuter <= 0) return 0;
        let maxR = 0;
        for (const r of rs) if (r > maxR) maxR = r;
        if (targetFillPct >= 100) return Math.max(0.01, maxR) + 0.01;
        let lo = 0, hi = Math.max(maxR * 1.2, 10);
        for (let iter = 0; iter < 40; iter++) {
            const mid = (lo + hi) / 2;
            const areaInner = areaFromSamples(rs, r => Math.max(0.01, r - mid));
            const fill = (1 - areaInner/areaOuter) * 100;
            if (fill < targetFillPct) lo = mid; else hi = mid;
        }
        return hi;
    }

    function onFillPctChange() {
        let fill = parseFloat(document.getElementById('fillPct').value);
        if (isNaN(fill)) fill = 100;
        fill = Math.min(100, Math.max(1, fill));
        document.getElementById('fillPct').value = fill;
        const eq = document.getElementById('equation').value;
        const thickness = fill >= 100 ? document.getElementById('shellThick').value : solveWallThicknessForFill(eq, fill).toFixed(3);
        document.getElementById('shellThick').value = thickness;
        updatePreview();
    }

    function onShellThickChange() {
        const eq = document.getElementById('equation').value;
        const shellThick = parseFloat(document.getElementById('shellThick').value) || 0;
        const fill = computeFillPercent(eq, shellThick);
        document.getElementById('fillPct').value = fill.toFixed(1);
        updatePreview();
    }

    function onDebrisPctChange() {
        let v = parseFloat(document.getElementById('debrisPct').value);
        if (isNaN(v)) v = 0.1;
        v = Math.min(1, Math.max(0.01, v));
        document.getElementById('debrisPct').value = v;
        updatePreview();
    }

    function onModelModeChange() {
        const isPot = document.getElementById('modelMode').value === 'pot';
        document.getElementById('potCuttingWrap').style.display = isPot ? 'block' : 'none';
        updatePreview();
    }

    function onCutPctChange() {
        let bp = parseFloat(document.getElementById('bottomCutPct').value);
        let tp = parseFloat(document.getElementById('topCutPct').value);
        if (isNaN(bp)) bp = 10;
        if (isNaN(tp)) tp = 90;
        bp = Math.min(Math.max(bp, 0), 99);
        tp = Math.min(Math.max(tp, bp + 1), 100);
        document.getElementById('bottomCutPct').value = bp;
        document.getElementById('topCutPct').value = tp;
        updatePreview();
    }

    function onHeightChange() {
        const cfg = readCfg();
        const desired = Math.max(0.01, parseFloat(document.getElementById('potHeight').value) || 0);
        const fullH = getFullHeightCm(cfg);
        const bp = cfg.bottomCutPct; // fixed anchor — Bottom Cut (%) is never adjusted by Height
        const windowPct = fullH > 0 ? (desired / fullH) * 100 : (cfg.topCutPct - cfg.bottomCutPct);
        let tp = Math.min(100, bp + windowPct);
        if (tp - bp < 0.5) tp = Math.min(100, bp + 0.5);
        document.getElementById('topCutPct').value = tp.toFixed(1);
        updatePreview();
    }

    function exportOBJ() {
        if (!requireCsg()) return;
        const geo = buildMesh(readCfg(), 10.0);
        const pos = geo.attributes.position.array, idx = geo.index.array;
        let obj = "# Equation-Driven Woven Pots Export\n";
        for(let i=0; i<pos.length; i+=3) obj += `v ${pos[i].toFixed(4)} ${pos[i+1].toFixed(4)} ${pos[i+2].toFixed(4)}\n`;
        for(let i=0; i<idx.length; i+=3) obj += `f ${idx[i]+1} ${idx[i+1]+1} ${idx[i+2]+1}\n`;
        download(obj, "equation_driven_woven_pots.obj");
    }

    function exportSTL() {
        if (!requireCsg()) return;
        const geo = buildMesh(readCfg(), 10.0);
        const pos = geo.attributes.position.array, idx = geo.index.array;
        const buf = new ArrayBuffer(84 + (idx.length / 3) * 50);
        const view = new DataView(buf);
        view.setUint32(80, idx.length / 3, true);
        const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), nrm = new THREE.Vector3();
        for (let i = 0, offset = 84; i < idx.length; i += 3, offset += 50) {
            const vA = idx[i] * 3, vB2 = idx[i + 1] * 3, vC = idx[i + 2] * 3;
            a.set(pos[vA], pos[vA + 1], pos[vA + 2]);
            b.set(pos[vB2], pos[vB2 + 1], pos[vB2 + 2]);
            c.set(pos[vC], pos[vC + 1], pos[vC + 2]);
            nrm.subVectors(c, b).cross(a.clone().sub(b)).normalize();
            view.setFloat32(offset, nrm.x, true);
            view.setFloat32(offset + 4, nrm.y, true);
            view.setFloat32(offset + 8, nrm.z, true);
            for (let j = 0; j < 3; j++) {
                const vB = idx[i + j] * 3;
                view.setFloat32(offset + 12 + j * 12, pos[vB], true);
                view.setFloat32(offset + 12 + j * 12 + 4, pos[vB + 1], true);
                view.setFloat32(offset + 12 + j * 12 + 8, pos[vB + 2], true);
            }
        }
        download(new Blob([buf]), "equation_driven_woven_pots.stl");
    }

    function download(content, name) {
        const link = document.createElement('a');
        link.href = (content instanceof Blob) ? URL.createObjectURL(content) : URL.createObjectURL(new Blob([content]));
        link.download = name; link.click();
    }

    function makeAxisLabel(text, color) {
        const canvas = document.createElement('canvas');
        canvas.width = 64; canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = color;
        ctx.font = 'bold 44px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 32, 34);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
        sprite.scale.set(0.5, 0.5, 0.5);
        return sprite;
    }

    function initAxisGizmo() {
        axisScene = new THREE.Scene();
        axisCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        axisScene.add(new THREE.AxesHelper(1));
        const labelX = makeAxisLabel('X', '#e74c3c'); labelX.position.set(1.3, 0, 0);
        const labelY = makeAxisLabel('Y', '#27ae60'); labelY.position.set(0, 1.3, 0);
        const labelZ = makeAxisLabel('Z', '#3498db'); labelZ.position.set(0, 0, 1.3);
        axisScene.add(labelX, labelY, labelZ);
    }

    function renderAxisGizmo() {
        axisCamera.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(4);
        axisCamera.up.copy(camera.up);
        axisCamera.lookAt(0, 0, 0);

        const size = 90, margin = 16;
        renderer.setViewport(margin, margin, size, size);
        renderer.setScissor(margin, margin, size, size);
        renderer.setScissorTest(true);
        renderer.clearDepth();
        renderer.autoClearColor = false;
        renderer.render(axisScene, axisCamera);
        renderer.autoClearColor = true;
        renderer.setScissorTest(false);
    }

    function initThree() {
        scene = new THREE.Scene(); scene.background = new THREE.Color(0xfafafa);
        const container = document.getElementById('viewer-container');
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.up.set(0, 0, 1);
        camera.position.set(65, 65, 65);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;
        controls.minAzimuthAngle = -Infinity;
        controls.maxAzimuthAngle = Infinity;
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const l = new THREE.PointLight(0xffffff, 1); l.position.set(30, 60, 30); scene.add(l);
        initAxisGizmo();
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.setViewport(0, 0, container.clientWidth, container.clientHeight);
            renderer.setScissorTest(false);
            renderer.render(scene, camera);
            renderAxisGizmo();
        }
        animate();
    }
    window.onload = () => { initThree(); applyPathPreset(); applyProfilePreset(); onModelModeChange(); onShellThickChange(); };
</script>

<!-- Manifold: exact mesh booleans (union / subtract / plane cuts / slicing) used for the solid → shell → cut pipeline. -->
<script type="module">
    import Module from 'https://cdn.jsdelivr.net/npm/manifold-3d@3.5.3/manifold.js';
    try {
        const wasm = await Module();
        wasm.setup();
        window.CSG = wasm;
        onCsgReady();
    } catch (e) {
        onCsgFailed(e);
    }
</script>
